<g><rect class="ext" x="40" y="96" width="420" height="112" rx="12"/><text class="t" x="58" y="132">Screen share</text><text class="l" x="58" y="162">getDisplayMedia → canvas every 500 ms</text></g>
<g><rect class="code" x="40" y="250" width="420" height="112" rx="12"/><text class="t" x="58" y="286">Client change detector + privacy pass</text><text class="l" x="58" y="316">dHash/pixel diff · best-effort OCR/PII blur</text><text class="l" x="58" y="340">privacy epoch (off-record ⇒ nothing sent)</text></g>
<g><rect class="code" x="40" y="404" width="420" height="112" rx="12"/><text class="t" x="58" y="440">Ordered perception queue</text><text class="l" x="58" y="470">1 in flight per session · coalesce newer frames</text><text class="l" x="58" y="494">frameSeq: stale responses never applied</text></g>
<g><rect class="model" x="40" y="558" width="420" height="112" rx="12"/><text class="t" x="58" y="594">Vision → screen events</text><text class="l" x="58" y="624">Claude Haiku 4.5, structured output</text><text class="l" x="58" y="648">measured independently (P2: below target)</text></g>
<g><rect class="code" x="40" y="712" width="202" height="112" rx="12"/><text class="t" x="58" y="748">Activity signals</text><text class="l" x="58" y="778">typing · motion</text><text class="l" x="58" y="802">VAD · local onset</text></g>
<g><rect class="code" x="258" y="712" width="202" height="112" rx="12"/><text class="t" x="276" y="748">DOM events</text><text class="l" x="276" y="778">CaseDesk only</text><text class="l" x="276" y="802">disclosed in UI</text></g>
<g><rect class="code" x="590" y="96" width="420" height="112" rx="12"/><text class="t" x="608" y="132">Decision context</text><text class="l" x="608" y="162">case · history · actor · environment</text><text class="l" x="608" y="186">schemaVersion (unknown = Kleene ‘unknown’)</text></g>
<g><rect class="mixed" x="590" y="250" width="420" height="112" rx="12"/><text class="t" x="608" y="286">Hypothesis engine</text><text class="l" x="608" y="316">enumerated candidates + LLM latent concepts</text><text class="l" x="608" y="340">surprise · expected information gain → queue</text></g>
<g><rect class="code" x="590" y="404" width="420" height="112" rx="12"/><text class="t" x="608" y="440">Deterministic gate</text><text class="l" x="608" y="470">silence · idle screen · no typing · budget</text><text class="l" x="608" y="494">→ GateAuthorization{nonce, +4 s, contextVersion}</text></g>
<g><rect class="code" x="590" y="558" width="420" height="112" rx="12"/><text class="t" x="608" y="594">Custom-LLM wrapper (thin)</text><text class="l" x="608" y="624">no valid nonce ⇒ skip_turn</text><text class="l" x="608" y="648">valid ⇒ speak the precomputed question</text></g>
<g><rect class="ext" x="590" y="712" width="420" height="112" rx="12"/><text class="t" x="608" y="748">ElevenLabs voice</text><text class="l" x="608" y="778">Scribe realtime ASR · v3 conversational TTS</text><text class="l" x="608" y="802">custom LLM = our wrapper (option A)</text></g>
<g><rect class="mixed" x="1140" y="96" width="420" height="112" rx="12"/><text class="t" x="1158" y="132">Expert answer → evidence</text><text class="l" x="1158" y="162">provenance human_voice · exact quote + frame</text><text class="l" x="1158" y="186">parser: Claude Sonnet 5.5 (schema-bound)</text></g>
<g><rect class="code" x="1140" y="250" width="420" height="112" rx="12"/><text class="t" x="1158" y="286">Z3 counterexamples → debrief</text><text class="l" x="1158" y="316">unresolved · conflict · boundary witnesses</text><text class="l" x="1158" y="340">within domain constraints · teach-back</text></g>
<g><rect class="code" x="1140" y="404" width="420" height="112" rx="12"/><text class="t" x="1158" y="440">Confirmed rulebook</text><text class="l" x="1158" y="470">evidence-mandatory · versioned · code-compiled</text><text class="l" x="1158" y="494">promotion needs the expert's own words</text></g>
<g><rect class="code" x="1140" y="558" width="420" height="112" rx="12"/><text class="t" x="1158" y="594">Human tutor</text><text class="l" x="1158" y="624">guardrail monitor · spoken intervention</text><text class="l" x="1158" y="648">deterministic Save interlock</text></g>
<g><rect class="code" x="1140" y="712" width="420" height="112" rx="12"/><text class="t" x="1158" y="748">MCP check_action</text><text class="l" x="1158" y="778">same rulebook guards AI agents</text><text class="l" x="1158" y="802">blocks with the expert's quote</text></g>
<rect class="ledger" x="40" y="872" width="1520" height="72" rx="12"/>
<text class="t" x="64" y="914">Append-only ledger underneath everything</text>
<text class="l" x="520" y="914">every input and derivation, with parent provenance · control turns are system_control, never evidence</text>
</svg>