<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Sage architecture</title>
  <desc id="d">Browser (CaseDesk, redacted screen share, DOM events, voice panel, speaking gate), the Sage server (perception, ledger, hypothesis engine, Z3, debrief, rulebook, Work Map, tutor, custom LLM endpoint) and external services (ElevenLabs Agents, Claude, Cloudflare R2, AI agents via MCP). Code-enforced parts are sage; model-proposed parts are ochre.</desc>
